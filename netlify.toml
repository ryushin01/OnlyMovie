[build]
  # version.txt는 배포 후 검사(live-check.yml)가 방금 올린 커밋이 배포되었는지 확인하는 데 씁니다.
  command = "pnpm build && printf '%s' \"$COMMIT_REF\" > dist/version.txt"
  publish = "dist"
  # 크레딧을 아끼려고 PR 미리보기, 브랜치 배포, 문서·테스트만 바뀐 커밋은 빌드하지 않습니다.
  ignore = "bash ./scripts/netlify-ignore.sh"

# 없는 빌드 파일은 앱 화면이 아니라 404로 응답해, 배포 후 검사가 누락을 잡을 수 있게 합니다.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# 직접 주소로 들어와도 앱이 200으로 열리게 합니다. 실제 파일이 있으면 그 파일이 우선합니다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 빌드 파일은 이름에 해시가 있어 내용이 바뀌면 주소도 바뀝니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 다른 사이트에 끼워 넣거나 파일 형식을 추측하는 공격을 막습니다.
# CSP의 style-src 'unsafe-inline'은 Emotion이 스타일을 주입하는 데 필요합니다. 스크립트는 사이트의 파일만 허용합니다.
# vite.config.ts가 이 CSP를 읽어 E2E에도 적용하므로 한 줄로 유지합니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
