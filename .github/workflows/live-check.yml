name: Live check

# 배포는 Netlify가 main 푸시를 받아 직접 합니다. 여기서는 그 배포가 끝나기를 기다렸다가 사이트를 검사합니다.
on:
  push:
    branches: [main]
    # Netlify가 빌드를 건너뛰는 변경(scripts/netlify-ignore.sh와 같은 목록)에는 새 배포가 없으므로 검사하지 않습니다.
    paths-ignore:
      - 'docs/**'
      - 'e2e/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.coderabbit.yaml'
      - '**/*.test.ts'
      - '**/*.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_URL: https://only-movie-ryushin.netlify.app

jobs:
  verify:
    name: 배포된 사이트 검사
    # 운영 주소에는 main만 배포되므로 다른 브랜치에서는 실행하지 않습니다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 이 커밋의 Netlify 배포 기다리기
        run: |
          for _ in $(seq 1 60); do
            deployed=$(curl -fsS --max-time 10 "$LIVE_URL/version.txt?sha=$GITHUB_SHA" || true)
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "배포 확인: $deployed"
              exit 0
            fi
            sleep 10
          done
          echo "10분 안에 $GITHUB_SHA 커밋이 배포되지 않았습니다. 현재 배포: $deployed" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-results
          path: test-results/
          retention-days: 7
